name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Cache the Python archive so subsequent runs skip the ~40 MB download
      - name: Cache bundled resources
        uses: actions/cache@v4
        with:
          path: cache/
          key: bundled-resources-${{ runner.os }}-${{ runner.arch }}-py3.12.9

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y fakeroot rpm

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend/yt-interface

      # FFmpeg: ffmpeg-static (installed above) already has the right binary for this runner.
      # bundle-ffmpeg.js copies it from node_modules → resources/ffmpeg/
      - name: Bundle FFmpeg
        run: node scripts/bundle-ffmpeg.js

      # Downloads standalone Python + pip-installs all backend requirements
      - name: Bundle Python
        run: node scripts/bundle-python.js

      - name: Build frontend
        run: npm run build:frontend

      # Call electron-builder directly — avoids the double frontend build that
      # `npm run dist:*` would trigger (those scripts include build:frontend internally).
      # --publish always  →  creates/updates a GitHub Release for the current tag.
      - name: Package & publish Electron app
        run: npx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional — app still builds without these,
          # but Gatekeeper will warn users on install).
          # Add CSC_LINK and CSC_KEY_PASSWORD as repo secrets to enable signing.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization (requires Apple Developer account)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.zip
            release/*.blockmap

