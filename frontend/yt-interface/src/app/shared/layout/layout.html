<div class="flex flex-col min-h-screen bg-surface">

  <!-- ── Top Navigation Bar ──────────────────────────────────── -->
  <header class="h-16 relative flex items-center px-4 md:px-6 sticky top-0 bg-surface-container-low border-b border-outline-variant/30 z-40 shrink-0">

    <!-- Brand (left) -->
    <div class="flex items-center gap-2.5 shrink-0">
      <div class="w-8 h-8 rounded-xl bg-primary flex items-center justify-center text-on-primary font-bold text-sm font-display select-none">
        S
      </div>
      <span class="font-display text-lg font-bold text-primary hidden sm:block">StreamFlow</span>
    </div>

    <!-- Nav pills (absolute center) -->
    <nav class="absolute left-1/2 -translate-x-1/2 flex items-center gap-1">
      <button
        (click)="navigate('dashboard')"
        class="flex items-center gap-2 px-3.5 py-2 rounded-full text-sm font-semibold transition-all"
        [class]="isNavActive('dashboard')
          ? 'bg-secondary-container text-on-secondary-container'
          : 'text-on-surface-variant hover:bg-surface-container-high'">
        <span class="material-symbols-outlined"
          [class]="isNavActive('dashboard') ? 'fill' : ''"
          style="font-size:18px">dashboard</span>
        <span class="hidden sm:block">Dashboard</span>
      </button>

      <button
        (click)="navigate('queue')"
        class="flex items-center gap-2 px-3.5 py-2 rounded-full text-sm font-semibold transition-all"
        [class]="isNavActive('queue')
          ? 'bg-secondary-container text-on-secondary-container'
          : 'text-on-surface-variant hover:bg-surface-container-high'">
        <span class="material-symbols-outlined"
          [class]="isNavActive('queue') ? 'fill' : ''"
          style="font-size:18px">hourglass_empty</span>
        <span class="hidden sm:block">Queue</span>
      </button>

      <button
        (click)="navigate('library')"
        class="flex items-center gap-2 px-3.5 py-2 rounded-full text-sm font-semibold transition-all"
        [class]="isNavActive('library')
          ? 'bg-secondary-container text-on-secondary-container'
          : 'text-on-surface-variant hover:bg-surface-container-high'">
        <span class="material-symbols-outlined"
          [class]="isNavActive('library') ? 'fill' : ''"
          style="font-size:18px">video_library</span>
        <span class="hidden sm:block">Library</span>
      </button>
    </nav>

    <!-- Settings (right) -->
    <div class="ml-auto flex items-center gap-1 shrink-0">
      <button
        (click)="goToSettings()"
        class="w-10 h-10 rounded-full flex items-center justify-center transition-colors"
        [class]="isOnSettings()
          ? 'bg-secondary-container text-on-secondary-container'
          : 'text-on-surface-variant hover:bg-surface-container-high'">
        <span class="material-symbols-outlined"
          [class]="isOnSettings() ? 'fill' : ''"
          style="font-size:20px">settings</span>
      </button>
    </div>
  </header>

  <!-- ── Page Content ────────────────────────────────────────── -->
  <main class="flex-1 flex flex-col min-h-0">
    <router-outlet></router-outlet>
  </main>

</div>
